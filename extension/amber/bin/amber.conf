# Amber — starts the dashboard once per boot, after the reader UI is up.
# Installed by /mnt/us/extensions/amber/bin/autostart.sh. To skip it without a
# computer, create a file named AMBER_DISABLE in the root of the Kindle's USB storage.
description "Amber dashboard autostart"

start on started lab126_gui

script
    [ -f /var/run/amber.booted ] && exit 0
    touch /var/run/amber.booted
    [ -f /mnt/us/AMBER_DISABLE ] && exit 0
    [ -x /mnt/us/extensions/amber/bin/start.sh ] || exit 0
    # Let the home screen settle; start.sh then waits for Wi-Fi on its own.
    sleep 20
    # setsid keeps Amber alive after this job finishes.
    /usr/bin/setsid /mnt/us/extensions/amber/bin/start.sh
end script
